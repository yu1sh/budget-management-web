{% extends 'ledger/base.html' %}
{% block content %}
<div class="page-heading">
  <div>
    <p><a href="{% url 'medical_person' visit.person_id %}?year={{ visit.record_year }}">← 医療費一覧</a></p>
    <h1>受診記録を編集</h1>
  </div>
</div>
<section class="panel medical-entry-panel">
  <p>薬局・交通費は、この受診記録の病院に付随する明細として更新されます。</p>
  <form method="post">
    {% csrf_token %}
    {% include 'ledger/includes/form_errors.html' %}
    <div class="medical-date-field"><label>{{ form.visited_on.label }}{{ form.visited_on }}{{ form.visited_on.errors }}</label></div>
    <div class="medical-cost-grid">
      <fieldset class="medical-cost-card"><legend>病院</legend><label>{{ form.hospital_name.label }}{{ form.hospital_name }}{{ form.hospital_name.errors }}</label><label>{{ form.hospital_amount.label }}{{ form.hospital_amount }}{{ form.hospital_amount.errors }}</label></fieldset>
      <fieldset class="medical-cost-card"><legend>薬局</legend><label>{{ form.pharmacy_name.label }}{{ form.pharmacy_name }}{{ form.pharmacy_name.errors }}</label><label>{{ form.pharmacy_amount.label }}{{ form.pharmacy_amount }}{{ form.pharmacy_amount.errors }}</label></fieldset>
      <fieldset class="medical-cost-card"><legend>交通費</legend><label>{{ form.transport_method.label }}{{ form.transport_method }}{{ form.transport_method.errors }}</label><label>{{ form.transport_amount.label }}{{ form.transport_amount }}{{ form.transport_amount.errors }}</label></fieldset>
    </div>
    <div class="medical-entry-actions"><button type="submit">更新を保存</button></div>
  </form>
</section>
{% endblock %}
