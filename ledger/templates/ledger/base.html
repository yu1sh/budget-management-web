{% load static %}<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>{% block title %}家計簿・医療費記録{% endblock %}</title><link rel="stylesheet" href="{% static 'ledger/site.css' %}"></head>
<body><header class="site-header"><a href="{% url 'chooser' %}" class="brand">家計簿・医療費記録</a>{% if user.is_authenticated %}<nav><a href="{% url 'household' %}">家計簿</a><a href="{% url 'sources' %}">支払い元別</a><a href="{% url 'medical' %}">医療費</a><a href="{% url 'source_settings' %}">支払い元設定</a><a href="{% url 'payment_link_settings' %}">引き落とし元設定</a><a href="{% url 'password_change' %}">パスワード</a><form action="{% url 'logout' %}" method="post">{% csrf_token %}<button class="link-button">ログアウト</button></form></nav>{% endif %}</header>
<main>{% if messages %}<div class="messages">{% for message in messages %}<p class="message {{ message.tags }}">{{ message }}</p>{% endfor %}</div>{% endif %}{% block content %}{% endblock %}</main><script src="{% static 'ledger/site.js' %}" defer></script><script src="{% static 'ledger/table-print.js' %}" defer></script></body></html>
