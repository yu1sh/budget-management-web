services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUNTIME_DIR: /app/runtime
      TZ: Asia/Tokyo
    volumes:
      - app_runtime:/app/runtime
    command: >-
      sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
  backup:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUNTIME_DIR: /app/runtime
      TZ: Asia/Tokyo
    volumes:
      - app_runtime:/app/runtime
    command: sh scripts/run-backup-loop.sh
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  app_runtime:
  caddy_data:
  caddy_config:
